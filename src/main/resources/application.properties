spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

# Cloud Run inyecta el puerto en la variable PORT; en local cae a 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/florisboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Esquema explicito: en PostgreSQL 15+ el search_path puede no incluir "public",
# lo que rompe las migraciones con "no schema has been selected to create in".
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

spring.flyway.enabled=true
# Flyway crea el esquema si no existe y ejecuta las migraciones dentro de el.
spring.flyway.schemas=${DB_SCHEMA:public}

app.security.issuer=${JWT_ISSUER:florisboard-backend}
app.security.token-ttl=${JWT_TOKEN_TTL:PT5H}
app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-before-production-123456}
app.security.encryption-key-base64=${PERSONAL_DATA_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
# CORS: en produccion definir CORS_ALLOWED_ORIGINS con el dominio del portal Angular (separar por comas).
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
# En produccion definir ALLOW_INSECURE_DEFAULTS=false para impedir arrancar con secretos por defecto.
app.security.allow-insecure-defaults=${ALLOW_INSECURE_DEFAULTS:true}

# app.ai.mode=stub usa la IA simulada (sin red); =http usa el servicio real (BETO).
app.ai.mode=${AI_MODE:stub}
app.ai.base-url=${AI_BASE_URL:http://localhost:5000}
app.ai.correction-path=${AI_CORRECTION_PATH:/interno/corregir}
app.ai.feedback-path=${AI_FEEDBACK_PATH:/interno/feedback}

springdoc.swagger-ui.path=/swagger-ui.html

app.demo-seed.enabled=false
app.demo-seed.reset=false
app.demo-seed.exit-after-run=false
app.demo-seed.student-count=15
app.demo-seed.teacher-password=DemoTeacher123
app.demo-seed.student-password=DemoStudent123
