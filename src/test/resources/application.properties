spring.datasource.url=jdbc:h2:mem:backend;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.security.issuer=florisboard-backend-test
app.security.token-ttl=PT5H
app.security.jwt-secret=test-secret-that-is-long-enough-for-hs256-signing
app.security.encryption-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.allowed-origins=*
app.security.allow-insecure-defaults=true

app.ai.base-url=http://localhost:5000
app.ai.correction-path=/interno/corregir
app.ai.feedback-path=/interno/feedback
